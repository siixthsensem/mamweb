<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>คำขอสั่งทำ | ละมุนลายผ้า</title><link rel="stylesheet" href="site.css?v=5"></head><body><header><a class="logo" href="index.html"><i></i>ละมุนลายผ้า</a><a href="admin.html">← แดชบอร์ดแอดมิน</a></header><main class="content"><div class="wrap dashboard"><aside class="side"><b>เมนูแอดมิน</b><hr style="border:0;border-top:1px solid #ddd3c3;margin:18px 0"><a href="admin.html">ภาพรวมร้านค้า</a><a href="admin-products.html">จัดการสินค้า</a><a class="active" href="admin-custom-orders.html">คำขอสั่งทำ</a><a href="#" onclick="signOut()">ออกจากระบบ</a></aside><section><span class="eyebrow">custom order requests</span><h1>คำขอสั่งทำ</h1><div class="panel" id="request-list"><p>กำลังโหลดคำขอ…</p></div></section></div></main><script src="supabase-config.js"></script><script type="module" src="supabase-client.js"></script><script src="auth.js?v=3"></script><script>window.addEventListener('load',async()=>{const s=await requireRole('admin');if(!s)return;const db=await supabaseReady,root=document.getElementById('request-list'),{data,error}=await db.from('custom_orders').select('*').order('created_at',{ascending:false});if(error){root.textContent=error.message;return}if(!data?.length){root.innerHTML='<p>ยังไม่มีคำขอสั่งทำ</p>';return}root.innerHTML='';data.forEach(x=>{const row=document.createElement('div');row.className='order';row.style.display='grid';row.style.gridTemplateColumns='minmax(0,1fr) auto auto';row.style.gap='10px';row.style.alignItems='center';const text=document.createElement('span');text.textContent=`${x.name||'ลูกค้า'} · ${x.work_type||'คำขอสั่งทำ'} · ${x.status||'รอการติดต่อ'}`;const select=document.createElement('select');['รอการติดต่อ','กำลังประเมิน','กำลังผลิต','เสร็จสิ้น'].forEach(v=>select.add(new Option(v,v,false,v===(x.status||'รอการติดต่อ'))));const confirm=document.createElement('button');confirm.className='filter';confirm.textContent='ยืนยันสถานะ';confirm.onclick=async()=>{const {error}=await db.from('custom_orders').update({status:select.value}).eq('id',x.id);if(error){alert(error.message);return}text.textContent=(x.name||'ลูกค้า')+' · '+(x.work_type||'คำขอสั่งทำ')+' · '+select.value;confirm.textContent='บันทึกแล้ว ✓';setTimeout(()=>confirm.textContent='ยืนยันสถานะ',1500)};row.append(text,select,confirm);root.append(row)})})</script></body></html>
