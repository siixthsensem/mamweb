<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครสมาชิก | ละมุนลายผ้า</title><link rel="stylesheet" href="site.css"></head><body><header><a class="logo" href="index.html"><i></i>ละมุนลายผ้า</a><a href="index.html">← กลับหน้าร้าน</a></header><main class="auth-page"><section class="auth-card"><span class="eyebrow">join us</span><h1>สมัครสมาชิก</h1><p>สร้างบัญชีเพื่อบันทึกคำสั่งซื้อของคุณ</p><form class="form" onsubmit="registerUser(event)"><label>ชื่อของคุณ<input required name="name" autocomplete="name" placeholder="ชื่อ-นามสกุล"></label><label>อีเมล<input required type="email" name="email" autocomplete="email" placeholder="you@example.com"></label><label>รหัสผ่าน<input required type="password" minlength="8" name="password" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัวอักษร"></label><button class="btn" type="submit">สมัครสมาชิก</button></form><div class="auth-status" id="auth-status"></div><p>มีบัญชีแล้ว? <a href="login.html" style="color:#bf694d;font-weight:700">เข้าสู่ระบบ</a></p></section></main><script src="supabase-config.js"></script><script type="module" src="supabase-client.js"></script><script src="auth.js"></script></body></html>
