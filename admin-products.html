<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการสินค้า | ละมุนลายผ้า</title><link rel="stylesheet" href="site.css?v=5"></head><body><header><a class="logo" href="index.html"><i></i>ละมุนลายผ้า</a><a href="admin.html">← แดชบอร์ดแอดมิน</a></header><main class="content"><div class="wrap dashboard"><aside class="side"><b>เมนูแอดมิน</b><hr style="border:0;border-top:1px solid #ddd3c3;margin:18px 0"><a href="admin.html">ภาพรวมร้านค้า</a><a class="active" href="admin-products.html">จัดการสินค้า</a><a href="admin-custom-orders.html">คำขอสั่งทำ</a><a href="#" onclick="signOut()">ออกจากระบบ</a></aside><section><span class="eyebrow">catalog management</span><h1>จัดการสินค้า</h1><div class="formbox"><h2>เพิ่มสินค้าใหม่</h2><form class="form" id="add-product"><label>ชื่อสินค้า<input required name="name" placeholder="เช่น กระเป๋าผ้า Morning Tote"></label><label>หมวดสินค้า<select name="category"><option>กระเป๋าผ้า</option><option>ของแต่งบ้าน</option><option>ของขวัญ</option><option>ของชิ้นเล็ก</option></select></label><label>รายละเอียดสั้น<input required name="detail" placeholder="เช่น ผ้าฝ้ายธรรมชาติ · สีครีม"></label><label>รายละเอียดสินค้าแบบเต็ม<textarea required name="description" placeholder="อธิบายขนาด วัสดุ จุดเด่น และวิธีใช้งาน เพื่อแสดงในหน้ารายละเอียดสินค้า"></textarea></label><label>ราคา (บาท)<input required min="1" type="number" name="price" placeholder="890"></label><label>จำนวนสต๊อกคงเหลือ<input required min="0" type="number" name="stock" value="0" placeholder="0"><small>สต๊อกจะถูกตัดเมื่อรายการสั่งซื้อสำเร็จ</small></label><label>รูปสินค้า<input type="file" name="image" accept="image/png,image/jpeg,image/webp"><small>รองรับ JPG, PNG หรือ WebP — แนะนำไม่เกิน 1 MB</small></label><img id="image-preview" class="upload-preview" alt="ตัวอย่างรูปสินค้า"><button class="btn" type="submit">เพิ่มสินค้า</button></form></div><div class="panel"><h2>สินค้าทั้งหมด</h2><div id="admin-product-list"></div></div></section></div></main><script src="supabase-config.js"></script><script type="module" src="supabase-client.js"></script><script src="auth.js?v=3"></script><script src="catalog.js?v=2"></script><script>requireRole('admin');const colors=['sand','green','beige','pink'],form=document.getElementById('add-product'),picker=form.elements.image,preview=document.getElementById('image-preview');let imageData='';picker.onchange=()=>{const file=picker.files[0];if(!file){imageData='';preview.removeAttribute('src');return}if(file.size>1024*1024){alert('กรุณาเลือกรูปขนาดไม่เกิน 1 MB');picker.value='';return}const reader=new FileReader();reader.onload=()=>{imageData=reader.result;preview.src=imageData};reader.readAsDataURL(file)};function renderAdmin(){const root=document.getElementById('admin-product-list');root.innerHTML='';catalog.load().forEach(p=>{const row=document.createElement('div');row.className='order';const info=document.createElement('span');info.textContent=p.name+' · '+catalog.money(p.price)+' · คงเหลือ '+(Number.isFinite(Number(p.stock))?p.stock:'ไม่ระบุ')+' ชิ้น';const remove=document.createElement('button');remove.className='filter';remove.textContent='ลบ';remove.onclick=()=>{if(confirm('ลบสินค้า “'+p.name+'” ใช่หรือไม่?')){catalog.save(catalog.load().filter(x=>x.id!==p.id));renderAdmin();}};row.append(info,remove);root.append(row);});}form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),list=catalog.load();list.push({id:'p'+Date.now(),name:f.get('name'),category:f.get('category'),detail:f.get('detail'),description:f.get('description'),price:Number(f.get('price')),stock:Number(f.get('stock')),color:colors[list.length%colors.length],icon:'✦',image:imageData});catalog.save(list);form.reset();imageData='';preview.removeAttribute('src');renderAdmin();alert('เพิ่มสินค้าเรียบร้อยแล้ว')};renderAdmin();</script></body></html>
