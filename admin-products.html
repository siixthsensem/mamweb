<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>จัดการสินค้า | ละมุนลายผ้า</title>
  <link rel="stylesheet" href="site.css?v=5">
  <style>
    .media-preview-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:4px 0 14px}
    .media-preview-list figure{margin:0;border:1px solid #ddd3c3;border-radius:10px;padding:7px;background:#fffdf8}
    .media-preview-list img,.media-preview-list video{display:block;width:100%;height:92px;object-fit:cover;border-radius:6px}
    .media-preview-list figcaption{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}
    .product-media-count{display:block;font-size:12px;color:#657069;margin-top:4px}
    .media-modal{position:fixed;inset:0;background:#1e2925a8;z-index:20;padding:24px;display:grid;place-items:center}
    .media-modal[hidden]{display:none}.media-dialog{width:min(760px,100%);max-height:min(760px,92vh);overflow:auto;background:#fffaf1;border-radius:18px;padding:24px;box-shadow:0 24px 70px #0004}
    .media-dialog-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.media-dialog-head h2{margin:0;font-size:24px}
    .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.media-card{border:1px solid #ded6c8;border-radius:12px;padding:8px;background:#fffdf8}.media-card img,.media-card video{width:100%;height:155px;display:block;object-fit:cover;border-radius:7px;background:#202522}.media-card video{object-fit:contain}.media-card p{font-size:12px;margin:7px 0;color:#657069}.media-card .media-actions{display:flex;flex-wrap:wrap;gap:6px}.media-card .filter{padding:6px 9px;font-size:12px}.cover-mark{color:#b95f43;font-weight:700}
    .admin-product-card{display:grid!important;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:18px 0!important;align-items:center!important}.admin-product-summary{display:flex;align-items:center;gap:14px;min-width:0}.admin-product-thumb{width:72px;height:72px;border-radius:11px;overflow:hidden;background:#ead9c0;display:grid;place-items:center;flex:none}.admin-product-thumb img{width:100%;height:100%;object-fit:cover}.admin-product-thumb span{font-size:30px}.admin-product-copy{min-width:0}.admin-product-copy h3{font-size:16px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.admin-product-copy p{margin:0;color:#657069;font-size:13px}.admin-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.admin-badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#edf3ed;color:#4c6656}.admin-badge.warn{background:#f8e7df;color:#a9563d}.admin-product-actions{display:grid;gap:9px;justify-items:end}.admin-stock-row,.admin-main-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.admin-stock-row label{font-size:13px;font-weight:700}.admin-stock-row input{width:66px;padding:7px;border:1px solid #d9d4c9;border-radius:8px;background:#fffdf8}.admin-main-actions .filter{padding:8px 11px;font-size:13px}.product-more{position:relative}.product-more summary{cursor:pointer;list-style:none;padding:8px 11px;border:1px solid #d9d4c9;border-radius:99px;font-size:13px;color:#536058}.product-more summary::-webkit-details-marker{display:none}.product-more[open] summary{background:#f4ead9}.product-more-menu{position:absolute;z-index:5;right:0;top:38px;min-width:180px;padding:8px;border:1px solid #ded6c8;border-radius:10px;background:#fffdf8;box-shadow:0 9px 25px #37291a24;display:grid;gap:5px}.product-more-menu .filter{border:0;border-radius:7px;text-align:left;padding:8px 9px}.product-more-menu .filter:hover{background:#f4ead9;color:#25302c}@media(max-width:760px){.admin-product-card{grid-template-columns:1fr!important;align-items:stretch!important}.admin-product-actions{justify-items:stretch}.admin-stock-row,.admin-main-actions{justify-content:flex-start}.product-more-menu{left:0;right:auto}.admin-product-copy h3{white-space:normal}.admin-main-actions .filter{flex:1}}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html"><i></i>ละมุนลายผ้า</a>
    <a href="admin.html">แดชบอร์ดแอดมิน</a>
  </header>
  <main class="content">
    <div class="wrap dashboard">
      <aside class="side">
        <b>เมนูแอดมิน</b><hr style="border:0;border-top:1px solid #ddd3c3;margin:18px 0">
        <a href="admin.html">ภาพรวมร้านค้า</a>
        <a class="active" href="admin-products.html">จัดการสินค้า</a>
        <a href="#" onclick="signOut();return false">ออกจากระบบ</a>
      </aside>
      <section>
        <span class="eyebrow">catalog management</span>
        <h1>จัดการสินค้า</h1>
        <div class="formbox">
          <h2>เพิ่มสินค้าใหม่</h2>
          <p id="product-status" class="auth-status" aria-live="polite"></p>
          <form class="form" id="add-product">
            <label>ชื่อสินค้า<input required name="name" placeholder="เช่น กระเป๋าผ้า Morning Tote"></label>
            <label>หมวดสินค้า<select name="category"><option>กระเป๋าผ้า</option><option>ของแต่งบ้าน</option><option>ของขวัญ</option><option>ของชิ้นเล็ก</option></select></label>
            <label>รายละเอียดสั้น<input required name="detail" placeholder="เช่น ผ้าฝ้ายธรรมชาติ · สีครีม"></label>
            <label>รายละเอียดสินค้าแบบเต็ม<textarea required name="description" placeholder="อธิบายขนาด วัสดุ จุดเด่น และวิธีใช้งาน"></textarea></label>
            <label>ราคา (บาท)<input required min="1" type="number" name="price" placeholder="890"></label>
            <label>จำนวนสต๊อกคงเหลือ<input required min="0" type="number" name="stock" value="0"></label>
            <label>รูปภาพและวิดีโอสินค้า<input type="file" name="media" accept="image/*,video/mp4,video/webm" multiple><small>อัปโหลดรูปหลายรูปได้ (ไม่เกิน 3 MB/รูป) และวิดีโอ MP4 หรือ WebM (ไม่เกิน 30 MB/ไฟล์)</small></label>
            <div id="media-preview" class="media-preview-list" aria-live="polite"></div>
            <button class="btn" type="submit">เพิ่มสินค้า</button>
          </form>
        </div>
        <div class="panel"><h2>สินค้าทั้งหมดในฐานข้อมูล</h2><div id="admin-product-list"><p>กำลังโหลดสินค้า…</p></div></div>
      </section>
    </div>
  </main>
  <div id="media-modal" class="media-modal" hidden role="dialog" aria-modal="true" aria-labelledby="media-modal-title">
    <div class="media-dialog">
      <div class="media-dialog-head"><div><span class="eyebrow">media manager</span><h2 id="media-modal-title">จัดการรูปและวิดีโอ</h2></div><button id="close-media-modal" class="filter" type="button">ปิด</button></div>
      <p id="media-modal-status" class="auth-status" aria-live="polite"></p>
      <div id="media-manager-list" class="media-grid"></div>
    </div>
  </div>
  <script src="supabase-config.js"></script>
  <script type="module" src="supabase-client.js"></script>
  <script src="auth.js?v=3"></script>
  <script src="catalog.js?v=6"></script>
  <script src="admin-products.js?v=7"></script>
</body>
</html>
