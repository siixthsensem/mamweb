<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>จัดการสินค้า | ละมุนลายผ้า</title>
  <link rel="stylesheet" href="site.css?v=5">
  <style>
    .media-preview-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:4px 0 14px}
    .media-preview-list figure{margin:0;border:1px solid #ddd3c3;border-radius:10px;padding:7px;background:#fffdf8}
    .media-preview-list img,.media-preview-list video{display:block;width:100%;height:92px;object-fit:cover;border-radius:6px}
    .media-preview-list figcaption{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}
    .product-media-count{display:block;font-size:12px;color:#657069;margin-top:4px}
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html"><i></i>ละมุนลายผ้า</a>
    <a href="admin.html">แดชบอร์ดแอดมิน</a>
  </header>
  <main class="content">
    <div class="wrap dashboard">
      <aside class="side">
        <b>เมนูแอดมิน</b><hr style="border:0;border-top:1px solid #ddd3c3;margin:18px 0">
        <a href="admin.html">ภาพรวมร้านค้า</a>
        <a class="active" href="admin-products.html">จัดการสินค้า</a>
        <a href="#" onclick="signOut();return false">ออกจากระบบ</a>
      </aside>
      <section>
        <span class="eyebrow">catalog management</span>
        <h1>จัดการสินค้า</h1>
        <div class="formbox">
          <h2>เพิ่มสินค้าใหม่</h2>
          <p id="product-status" class="auth-status" aria-live="polite"></p>
          <form class="form" id="add-product">
            <label>ชื่อสินค้า<input required name="name" placeholder="เช่น กระเป๋าผ้า Morning Tote"></label>
            <label>หมวดสินค้า<select name="category"><option>กระเป๋าผ้า</option><option>ของแต่งบ้าน</option><option>ของขวัญ</option><option>ของชิ้นเล็ก</option></select></label>
            <label>รายละเอียดสั้น<input required name="detail" placeholder="เช่น ผ้าฝ้ายธรรมชาติ · สีครีม"></label>
            <label>รายละเอียดสินค้าแบบเต็ม<textarea required name="description" placeholder="อธิบายขนาด วัสดุ จุดเด่น และวิธีใช้งาน"></textarea></label>
            <label>ราคา (บาท)<input required min="1" type="number" name="price" placeholder="890"></label>
            <label>จำนวนสต๊อกคงเหลือ<input required min="0" type="number" name="stock" value="0"></label>
            <label>รูปภาพและวิดีโอสินค้า<input type="file" name="media" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm" multiple><small>อัปโหลดรูปหลายรูปได้ (ไม่เกิน 3 MB/รูป) และวิดีโอ MP4 หรือ WebM (ไม่เกิน 30 MB/ไฟล์)</small></label>
            <div id="media-preview" class="media-preview-list" aria-live="polite"></div>
            <button class="btn" type="submit">เพิ่มสินค้า</button>
          </form>
        </div>
        <div class="panel"><h2>สินค้าทั้งหมดในฐานข้อมูล</h2><div id="admin-product-list"><p>กำลังโหลดสินค้า…</p></div></div>
      </section>
    </div>
  </main>
  <script src="supabase-config.js"></script>
  <script type="module" src="supabase-client.js"></script>
  <script src="auth.js?v=3"></script>
  <script src="catalog.js?v=6"></script>
  <script src="admin-products.js?v=3"></script>
</body>
</html>
