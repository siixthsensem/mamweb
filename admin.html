<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แอดมิน | ละมุนลายผ้า</title><link rel="stylesheet" href="site.css"></head><body><header><a class="logo" href="index.html"><i></i>ละมุนลายผ้า</a><a href="index.html">ดูหน้าร้าน</a></header><main class="content"><div class="wrap dashboard"><aside class="side"><div class="user-line"><div class="avatar">A</div><div><b id="admin-name">ผู้ดูแลร้าน</b><br><small>Administrator</small></div></div><hr style="border:0;border-top:1px solid #ddd3c3;margin:18px 0"><a class="active" href="admin.html">ภาพรวมร้านค้า</a><a href="admin-products.html">จัดการสินค้า</a><a href="#" onclick="signOut()">ออกจากระบบ</a></aside><section><span class="eyebrow">admin dashboard</span><h1>ภาพรวมร้านค้า</h1><div class="stats"><div class="stat"><b id="orders-count">0</b><span>คำสั่งซื้อทั้งหมด</span></div><div class="stat"><b id="products-count">0</b><span>สินค้าในร้าน</span></div><div class="stat"><b id="messages-count">0</b><span>ข้อความใหม่</span></div></div><div class="panel"><h2>จัดการสินค้า</h2><p>เพิ่ม ลบ และจัดการรายการสินค้าจากฐานข้อมูลจริง</p><a class="btn" href="admin-products.html">ไปหน้าจัดการสินค้า</a></div></section></div></main><script src="supabase-config.js"></script><script type="module" src="supabase-client.js"></script><script src="auth.js"></script><script>window.addEventListener('load',async()=>{const session=await requireRole('admin');if(!session)return;document.getElementById('admin-name').textContent=session.profile.display_name||session.user.email;const db=await supabaseReady;const [orders,products,messages]=await Promise.all([db.from('orders').select('*',{count:'exact',head:true}),db.from('products').select('*',{count:'exact',head:true}),db.from('messages').select('*',{count:'exact',head:true})]);document.getElementById('orders-count').textContent=orders.count||0;document.getElementById('products-count').textContent=products.count||0;document.getElementById('messages-count').textContent=messages.count||0})</script></body></html>
