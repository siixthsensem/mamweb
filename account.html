<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>บัญชีของฉัน | ละมุนลายผ้า</title>
  <link rel="stylesheet" href="site.css?v=5">
</head>
<body>
  <header>
    <a class="logo" href="index.html"><i></i>ละมุนลายผ้า</a>
    <nav><a href="products.html">สินค้า</a><a href="about.html">เรื่องราวของเรา</a><a href="custom-order.html">สั่งทำพิเศษ</a><a href="contact.html">ติดต่อเรา</a></nav>
    <div class="actions"><a class="cart" href="cart.html" aria-label="ตะกร้าสินค้า">🛍<b class="count">0</b></a><a class="auth-chip" data-auth-menu href="login.html">เข้าสู่ระบบ</a></div>
  </header>
  <main class="content">
    <div class="wrap dashboard">
      <aside class="side">
        <div class="user-line"><div class="avatar" id="avatar">ล</div><div><b id="name">บัญชีของฉัน</b><br><small id="email"></small></div></div>
        <hr style="border:0;border-top:1px solid #ddd3c3;margin:18px 0">
        <a class="active" href="account.html">ข้อมูลส่วนตัว</a><a href="#orders">คำสั่งซื้อของฉัน</a><a href="products.html">เลือกซื้อสินค้า</a><a href="#" onclick="signOut()">ออกจากระบบ</a>
      </aside>
      <section>
        <span class="eyebrow">my account</span><h1>ข้อมูลส่วนตัว</h1>
        <div class="formbox"><form class="form" id="profile-form">
          <label>รูปโปรไฟล์<input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp"><img id="avatar-preview" class="upload-preview" alt="ตัวอย่างรูป"></label>
          <label>ชื่อที่แสดง<input required name="display_name"></label>
          <label>อีเมล<input id="profile-email" name="email" type="email" readonly aria-readonly="true"></label>
          <label>เบอร์โทรศัพท์<input name="phone" inputmode="tel"></label>
          <label>วันเดือนปีเกิด<input type="date" name="birth_date"><small>ระบบคำนวณอายุจากวันเกิดอัตโนมัติ ไม่ต้องกรอกอายุ</small></label>
          <label>ที่อยู่สำหรับจัดส่ง<textarea name="address" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด รหัสไปรษณีย์"></textarea></label>
          <button class="btn" type="submit">บันทึกข้อมูล</button>
        </form><div class="auth-status" id="profile-status"></div></div>
        <div class="panel" id="orders"><h2>คำสั่งซื้อของฉัน</h2><p>กำลังโหลดคำสั่งซื้อ...</p></div>
      </section>
    </div>
  </main>
  <script src="catalog.js?v=2"></script>
  <script src="supabase-config.js"></script>
  <script type="module" src="supabase-client.js"></script>
  <script src="auth.js?v=3"></script>
  <script src="auth-menu.js?v=4"></script>
  <script src="account-dashboard.js?v=1"></script>
</body>
</html>
