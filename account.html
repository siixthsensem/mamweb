<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชีของฉัน | ละมุนลายผ้า</title><link rel="stylesheet" href="site.css"></head><body><header><a class="logo" href="index.html"><i></i>ละมุนลายผ้า</a><a href="index.html">กลับหน้าร้าน</a></header><main class="content"><div class="wrap dashboard"><aside class="side"><div class="user-line"><div class="avatar" id="avatar">ล</div><div><b id="name">บัญชีของฉัน</b><br><small id="email"></small></div></div><hr style="border:0;border-top:1px solid #ddd3c3;margin:18px 0"><a class="active" href="account.html">บัญชีของฉัน</a><a href="#orders">คำสั่งซื้อของฉัน</a><a href="products.html">เลือกซื้อสินค้า</a><a href="#" onclick="signOut()">ออกจากระบบ</a></aside><section><span class="eyebrow">my account</span><h1>สวัสดีค่ะ <span id="welcome"></span> ✦</h1><div class="panel" id="orders"><h2>คำสั่งซื้อล่าสุด</h2><p id="orders-empty">ยังไม่มีคำสั่งซื้อ</p></div></section></div></main><script src="supabase-config.js"></script><script type="module" src="supabase-client.js"></script><script src="auth.js"></script><script>window.addEventListener('load',async()=>{const data=await requireRole('customer');if(!data)return;const name=data.profile.display_name||data.user.email;document.getElementById('name').textContent=name;document.getElementById('welcome').textContent=name.split(' ')[0];document.getElementById('email').textContent=data.user.email;document.getElementById('avatar').textContent=name[0];const db=await supabaseReady;const {data:orders}=await db.from('orders').select('id,status,total,created_at').eq('user_id',data.user.id).order('created_at',{ascending:false});if(orders?.length){const root=document.getElementById('orders');root.innerHTML='<h2>คำสั่งซื้อล่าสุด</h2>';orders.forEach(o=>root.innerHTML+=`<div class="order"><span>#${o.id.slice(0,8)}</span><b>${o.status} · ฿ ${Number(o.total).toLocaleString()}</b></div>`)} })</script></body></html>
