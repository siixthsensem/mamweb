<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ | ละมุนลายผ้า</title><link rel="stylesheet" href="site.css"><script src="https://accounts.google.com/gsi/client" async></script></head><body><header><a class="logo" href="index.html"><i></i>ละมุนลายผ้า</a><a href="index.html">← กลับหน้าร้าน</a></header><main class="auth-page"><section class="auth-card"><span class="eyebrow">welcome back</span><h1>เข้าสู่ระบบ</h1><p>เข้าสู่ระบบเพื่อดูคำสั่งซื้อและสิทธิพิเศษของคุณ</p><form class="form" onsubmit="loginWithPassword(event)"><label>ประเภทบัญชี<select name="role"><option value="user">ผู้ใช้งานทั่วไป</option><option value="admin">ผู้ดูแลระบบ</option></select></label><label>อีเมล / ไอดี<input required name="username" autocomplete="username" placeholder="อีเมล หรือไอดีแอดมิน"></label><label>รหัสผ่าน<input required type="password" name="password" autocomplete="current-password" placeholder="รหัสผ่าน"></label><button class="btn" type="submit">เข้าสู่ระบบ</button></form><div class="auth-status" id="auth-status"></div><p>ยังไม่มีบัญชี? <a href="register.html" style="color:#bf694d;font-weight:700">สมัครสมาชิก</a></p><div class="divider">หรือ</div><div class="google-box" id="google-button"></div><p class="notice">สำหรับผู้ดูแลระบบ ใช้ไอดีและรหัสผ่านที่ได้รับเท่านั้น</p></section></main><script src="auth-config.js"></script><script src="auth.js"></script></body></html>
